name: Deploy study to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "study/**"
      - ".github/workflows/deploy-study-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Publish a copy of study/ WITHOUT the raw source images. The study only
      # loads images/pool and images/examples; source-images/ is just the
      # labelled originals that sync_images.py reads, and it eats the 1 GB limit.
      - name: Stage site without source-images
        run: |
          cp -r study _site
          rm -rf _site/source-images
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4